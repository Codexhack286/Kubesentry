apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesentry-sa
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesentry-pod-reader
  namespace: demo
rules:
- apiGroups: [""] # Core API group
  resources: ["pods"]
  verbs: ["get", "list", "watch"] # Strictly read-only!
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesentry-read-pods
  namespace: demo
subjects:
- kind: ServiceAccount
  name: kubesentry-sa
  namespace: demo
roleRef:
  kind: Role
  name: kubesentry-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: kubesentry
  namespace: demo
spec:
  serviceAccountName: kubesentry-sa # Run with restricted privileges
  containers:
  - name: sentry
    image: kubesentry:v0.1
    imagePullPolicy: Never # Use local image from Minikube
    args: ["--watch", "--namespace=demo"]